<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoopyCamPanel2</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="app-titlebar">
    <strong>LoopyCamPanel2</strong>
    <span id="connection" class="connection offline"><i></i>Connecting</span>
  </header>

  <main class="panel-grid">
    <section class="pane configuration-pane" aria-labelledby="configuration-title">
      <h1 id="configuration-title" class="pane-title">Configuration</h1>

      <div class="group-title">FF Pre</div>
      <div id="slots-pre" class="plugin-slots" data-plugin-type="pre"></div>

      <div class="group-title">Loops</div>
      <div id="loops" class="loop-list" aria-label="Loops"></div>

      <div class="group-title">FF Post</div>
      <div id="slots-post" class="plugin-slots" data-plugin-type="post"></div>

      <div class="group-title">FFGL</div>
      <div id="slots-ffgl" class="plugin-slots" data-plugin-type="ffgl"></div>
    </section>

    <section class="pane parameters-pane" aria-labelledby="parameters-title">
      <h1 id="parameters-title" class="pane-title">Parameters</h1>
      <div class="plugin-heading">
        <span>Plugin</span>
        <strong id="selected-plugin">None</strong>
      </div>
      <div id="parameter-list" class="parameter-list">
        <p class="empty-message">Select an active plugin slot.</p>
      </div>
      <div class="parameter-actions">
        <button id="random-params">Rand Params</button>
        <button id="default-params">Defaults</button>
        <button id="random-current">Rand Plugin</button>
        <button id="clear-current">Clear Plugin</button>
      </div>

      <div class="group-title options-title">Looper options</div>
      <div class="options-grid">
        <label>Auto Next <input type="checkbox" data-toggle="autoNext"></label>
        <label>Trails <input type="checkbox" data-toggle="trail"></label>
        <label>XOR <input type="checkbox" data-toggle="xor"></label>
        <label>Border <input type="checkbox" data-toggle="border"></label>
        <label>Rec Border <input type="checkbox" data-toggle="recordBorder"></label>
        <label>Smooth <input type="checkbox" data-toggle="smooth"></label>
        <label>Interpolation <input type="checkbox" data-toggle="interpolate"></label>
        <label class="trail-control">Trail amount
          <span><input id="trail-amount" type="range" min="0" max="1" step="0.01"><output id="trail-value">0.90</output></span>
        </label>
      </div>
    </section>

    <section class="pane controller-pane" aria-labelledby="controller-title">
      <h1 id="controller-title" class="pane-title">Live Control</h1>

      <div class="status-grid" aria-label="Looper status">
        <div><span>Selected loop</span><strong id="current-loop">1</strong></div>
        <div><span>Active loops</span><strong id="active-loop-count">1</strong></div>
        <div><span>Visible windows</span><strong id="window-count">1</strong></div>
        <div><span>Current mode</span><strong id="mode">Live</strong></div>
      </div>
      <div id="streamdeck-status" class="deck-status offline"><i></i><span>Stream Deck disconnected</span></div>

      <div class="group-title">Performance</div>
      <div class="performance-controls">
        <button id="record"><strong>●</strong><span>Record</span></button>
        <button id="overlay"><strong>◎</strong><span>Overlay</span></button>
        <button data-action="allLive"><strong>◉</strong><span>All Live</span></button>
        <button id="blackout"><strong>■</strong><span>Blackout</span></button>
      </div>

      <div class="group-title">Loop Status</div>
      <div id="status-loops" class="status-loop-grid" aria-label="Loop status and selector"></div>

      <div class="group-title">Window Layout</div>
      <div class="layout-controls">
        <div class="window-stepper">
          <button data-action="lessWindows" aria-label="Fewer windows">−</button>
          <output id="window-output">1</output>
          <button data-action="moreWindows" aria-label="More windows">+</button>
        </div>
        <div class="layout-buttons">
          <button data-action="fullDisplay">Full Frame</button>
          <button data-action="quadrantDisplay">Quadrants</button>
        </div>
      </div>
    </section>
  </main>

  <section class="console-panel" aria-labelledby="console-title">
    <div class="console-titlebar">
      <strong id="console-title">LoopyCam Console</strong>
      <button id="clear-console" type="button">Clear</button>
    </div>
    <div id="console-output" class="console-output" role="log" aria-live="polite"></div>
    <form id="console-form" class="console-input-row">
      <label for="console-input">loopycam&gt;</label>
      <input id="console-input" autocomplete="off" spellcheck="false" placeholder="Type help for commands">
    </form>
  </section>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js"></script>
</body>
</html>
